<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dp</title>
<link id="fav" rel="icon">
<style>
:root{
  --bg:#0d0a1d; --panel:rgba(255,255,255,.055); --panel2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --text:#f2efff; --muted:#9b94c4;
  --purple:#a855f7; --purple2:#7c3aed; --pink:#ec4899; --cyan:#38bdf8;
  --c-pink:#ff3ea5; --c-orange:#ff9f1c; --c-blue:#2ea8ff; --c-green:#39ff88;
  --hourw:52px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; color:var(--text); overflow:hidden;
  font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo','Segoe UI',system-ui,sans-serif;
  background:
    radial-gradient(900px 500px at 8% -10%,rgba(124,58,237,.35),transparent 60%),
    radial-gradient(800px 500px at 100% 0%,rgba(236,72,153,.22),transparent 60%),
    radial-gradient(900px 600px at 50% 120%,rgba(88,28,235,.28),transparent 60%),
    var(--bg);
  display:grid; grid-template-rows:auto 1fr auto;
}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}

/* header */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:16px 24px 12px}
.brand{display:flex;align-items:center;gap:12px}
#logo{width:42px;height:42px;display:block;filter:drop-shadow(0 6px 14px rgba(168,85,247,.55))}
#logo svg{width:100%;height:100%;display:block}
.brand b{font-size:22px;letter-spacing:.5px;display:block;line-height:1}
.brand small{color:var(--muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.beta{font-style:normal;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:linear-gradient(135deg,var(--purple),var(--pink));margin-left:2px}
.datenav{display:flex;align-items:center;gap:10px}
.ic{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:22px;line-height:1;transition:.2s}
.ic:hover{background:var(--panel2);transform:translateY(-1px);border-color:rgba(168,85,247,.6)}
.ic:active{transform:scale(.92)}
.datebox{position:relative;min-width:230px;text-align:center;padding:6px 14px;border-radius:14px;cursor:pointer;transition:.2s}
.datebox:hover{background:var(--panel)}
#dateMain{font-size:21px;font-weight:700;letter-spacing:.3px}
#dateSub{font-size:12px;color:var(--muted);margin-top:2px}
#dateSub .tag{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:rgba(168,85,247,.25);color:#e9d5ff;font-weight:600}
#datePick{position:absolute;left:50%;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:8px 16px;font-size:13px;font-weight:600;transition:.2s}
.chip:hover{background:linear-gradient(135deg,var(--purple2),var(--pink));border-color:transparent}
.tools{display:flex;justify-content:flex-end;gap:8px}
.tools .chip{padding:6px 12px;font-size:12px;color:var(--muted)}
.tools .chip:hover{color:#fff}

/* layout */
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,410px);gap:18px;padding:0 24px;min-height:0}
.panel{min-height:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px);box-shadow:0 20px 50px rgba(0,0,0,.35);overflow:hidden}
.p-head{display:flex;align-items:center;gap:14px;padding:14px 18px 10px}
.p-head h2{margin:0;font-size:16px;letter-spacing:.3px}
.muted{color:var(--muted);font-size:12px}
.legend{display:flex;gap:12px;font-size:11.5px;color:var(--muted);margin-left:4px}
.legend i{display:inline-block;width:14px;height:9px;border-radius:3px;vertical-align:middle;margin-right:5px}
.legend .lp{background:rgba(56,189,248,.25);border:1.5px dashed var(--cyan)}
.legend .lr{background:linear-gradient(135deg,var(--purple),var(--pink))}
.sums{margin-left:auto;display:flex;gap:8px}
.sum{font-size:11.5px;padding:3px 10px;border-radius:99px;background:rgba(0,0,0,.25);color:var(--muted)}
.sum b{color:var(--text);margin-left:3px}
.sum.p b{color:#8fd8ff}.sum.r b{color:#f0abfc}

/* timetable */
.mins{display:flex;padding:0 14px 4px calc(14px + var(--hourw));font-size:10.5px;color:var(--muted)}
.mins span{flex:1;padding-left:6px;border-left:1px solid var(--line)}
.tt-scroll{flex:1;min-height:0;overflow:auto;padding:0 14px 14px;scrollbar-width:thin;scrollbar-color:rgba(168,85,247,.5) transparent}
.tt-body{display:flex;height:100%;min-height:744px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(0,0,0,.18)}
.hours{width:var(--hourw);display:grid;grid-template-rows:repeat(24,1fr);border-right:1px solid var(--line)}
.hours div{display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;transition:.3s}
.hours div:last-child,.hrow:last-child{border-bottom:0}
.hours div.cur{color:#fff;background:linear-gradient(90deg,rgba(236,72,153,.35),transparent)}
.grid{flex:1;position:relative;display:grid;grid-template-rows:repeat(24,1fr);cursor:crosshair;user-select:none;-webkit-user-select:none}
.hrow{display:grid;grid-template-columns:repeat(6,1fr);border-bottom:1px solid var(--line);position:relative}
.hrow.night{background:rgba(0,0,0,.22)}
.hrow::after{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px dashed rgba(255,255,255,.055);pointer-events:none}
.hrow i{border-left:1px solid rgba(255,255,255,.045)}
.hrow i:first-child{border-left:0}
.hrow i:nth-child(4){border-left-color:rgba(255,255,255,.1)}
.layer{position:absolute;inset:0;pointer-events:none}
.seg{position:absolute;display:flex;align-items:center;padding:0 7px;border-radius:7px;overflow:hidden;white-space:nowrap;font-size:11.5px;font-weight:600;color:#fff}
.seg span{overflow:hidden;text-overflow:ellipsis}
.seg.plan{background:rgba(56,189,248,.2);border:1.5px dashed rgba(56,189,248,.95);color:#d6f2ff}
.seg.rec{background:linear-gradient(135deg,#a855f7,#ec4899);box-shadow:0 3px 12px rgba(168,85,247,.5)}
.seg.preview{opacity:.65;outline:1.5px solid rgba(255,255,255,.7)}
.seg.pop{animation:pop .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.now{position:absolute;width:2px;margin-left:-1px;background:#ff4d8d;box-shadow:0 0 10px 2px rgba(255,77,141,.8);z-index:2;pointer-events:none;border-radius:2px}
.now::before{content:"";position:absolute;top:-3px;left:-3px;width:8px;height:8px;border-radius:50%;background:#ff4d8d}

/* todo */
#addForm{display:flex;gap:8px;padding:0 16px}
#addIn{flex:1;min-width:0;background:rgba(0,0,0,.28);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;transition:.2s}
#addIn:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(168,85,247,.25)}
#addForm button{border:0;border-radius:12px;padding:0 18px;font-weight:700;background:linear-gradient(135deg,var(--purple2),var(--pink));transition:.2s}
#addForm button:hover{filter:brightness(1.15);transform:translateY(-1px)}
.hint{padding:8px 18px 6px;font-size:11px;color:var(--muted)}
.hint kbd{background:rgba(255,255,255,.1);border-radius:5px;padding:0 5px;font-family:inherit}
#todoList{list-style:none;margin:0;padding:4px 12px 14px;overflow:auto;flex:1;min-height:0;scrollbar-width:thin;scrollbar-color:rgba(168,85,247,.5) transparent}
.empty{text-align:center;color:var(--muted);padding:50px 10px;font-size:13px;line-height:1.8}
.todo{--c:transparent;position:relative;display:flex;align-items:center;gap:10px;padding:10px 10px 10px 12px;margin-bottom:7px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid transparent;border-left:4px solid transparent;cursor:pointer;transition:background .25s,border-color .25s,opacity .25s,box-shadow .25s}
.todo.c-pink{--c:var(--c-pink)} .todo.c-orange{--c:var(--c-orange)} .todo.c-blue{--c:var(--c-blue)} .todo.c-green{--c:var(--c-green)}
.todo[class*=" c-"]{background:linear-gradient(90deg,color-mix(in srgb,var(--c) 38%,transparent),color-mix(in srgb,var(--c) 13%,transparent));border-left-color:var(--c);box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent)}
.todo:hover{border-color:rgba(255,255,255,.18)}
.todo.sel{border-color:#fff;box-shadow:0 0 0 2px rgba(168,85,247,.7)}
.todo.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{opacity:0;transform:translateX(24px) scale(.96)}to{opacity:1;transform:none}}
.chk{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid rgba(255,255,255,.55);background:rgba(0,0,0,.2);display:grid;place-items:center;transition:.2s;padding:0}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .3s .05s}
.todo.done .chk{background:linear-gradient(135deg,var(--purple2),var(--purple));border-color:transparent}
.todo.done .chk svg{stroke-dashoffset:0}
.todo.tog .chk{animation:chk .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes chk{0%{transform:scale(.7)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
.txt{flex:1;min-width:0;font-size:14px;line-height:1.35;word-break:break-all;transition:.25s}
.txt input{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--purple);border-radius:8px;padding:4px 8px;outline:none}
.todo.done .txt{text-decoration:line-through;opacity:.5}
.todo.done{opacity:.72}
.prio{flex:none;min-width:26px;height:26px;padding:0 7px;border-radius:99px;display:none;align-items:center;justify-content:center;font-size:12.5px;font-weight:800;background:rgba(0,0,0,.4);border:1px solid rgba(255,255,255,.25)}
.prio.has{display:inline-flex;background:#fff;color:#2a1650;border-color:transparent}
.todo.sel .prio{display:inline-flex}
.prio.typing{background:rgba(0,0,0,.55);color:#fff;border-color:var(--purple)}
.prio.typing::after{content:"";width:1.5px;height:13px;background:#fff;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tools-r{flex:none;display:none;align-items:center;gap:5px}
.todo:hover .tools-r,.todo.sel .tools-r{display:flex}
.dot{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.65);padding:0;transition:.15s}
.dot:hover{transform:scale(1.3)}
.dot.pink{background:var(--c-pink)}.dot.orange{background:var(--c-orange)}.dot.blue{background:var(--c-blue)}.dot.green{background:var(--c-green)}
.dot.none{background:transparent;position:relative}
.dot.none::after{content:"";position:absolute;left:50%;top:-2px;height:15px;border-left:2px solid rgba(255,255,255,.65);transform:rotate(45deg)}
.del{width:22px;height:22px;border:0;border-radius:7px;background:rgba(0,0,0,.35);font-size:15px;line-height:1;padding:0}
.del:hover{background:#e11d48}

/* gauge */
footer{padding:14px 24px 20px;display:flex;justify-content:center}
.gauge{position:relative;width:min(780px,100%);padding:14px 20px 16px;border-radius:22px;background:var(--panel);border:1px solid var(--line);box-shadow:0 14px 40px rgba(0,0,0,.35),0 0 0 1px rgba(168,85,247,.08) inset;backdrop-filter:blur(14px)}
.g-top{display:flex;align-items:baseline;gap:12px;margin-bottom:10px}
.g-title{font-weight:700;font-size:14px}
.g-msg{font-size:12.5px;color:#d8b4fe}
.g-count{margin-left:auto;font-size:12.5px;color:var(--muted)}
.g-row{display:flex;align-items:center;gap:18px}
.g-pct{flex:none;width:96px;text-align:right;font-size:38px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(135deg,#e9d5ff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.g-pct small{font-size:18px;margin-left:2px}
.g-track{position:relative;flex:1;height:22px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--line);overflow:hidden}
.g-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#6d28d9,#a855f7 60%,#d8b4fe);box-shadow:0 0 22px 2px rgba(168,85,247,.75);transition:width 1s cubic-bezier(.22,1,.36,1);overflow:hidden}
.g-fill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.16) 0 10px,transparent 10px 22px);animation:slide 1.2s linear infinite}
.g-shine{position:absolute;top:0;bottom:0;width:60px;left:-60px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:shine 2.6s ease-in-out infinite;z-index:1}
@keyframes slide{to{background-position:22px 0}}
@keyframes shine{0%{left:-60px}60%,100%{left:110%}}
.g-ticks{position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.1) calc(10% - 1px) 10%);pointer-events:none}
.gauge.full .g-fill{animation:glow 1.4s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 34px 6px rgba(216,180,254,.95)}}
.gauge.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes bump{50%{transform:scale(1.02)}}
.g-burst{position:absolute;right:30px;top:50%;pointer-events:none}
.g-burst i{position:absolute;width:8px;height:8px;border-radius:50%;animation:burst 1.1s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}

/* popup + toast */
#pop{position:fixed;z-index:50;width:290px;padding:14px;border-radius:16px;background:rgba(28,20,58,.96);border:1px solid rgba(168,85,247,.5);box-shadow:0 20px 50px rgba(0,0,0,.6);animation:enter .25s ease}
#pop.hidden,#toast:not(.show){display:none}
#popTitle{font-size:12px;font-weight:700;margin-bottom:9px}
#popTitle.plan{color:#8fd8ff}#popTitle.rec{color:#f0abfc}
#popIn{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:none}
#popIn:focus{border-color:var(--purple)}
.pop-btns{display:flex;gap:7px;margin-top:10px;justify-content:flex-end}
.pop-btns button{border:0;border-radius:9px;padding:7px 13px;font-size:12.5px;font-weight:600;background:rgba(255,255,255,.1)}
.pop-btns .ok{background:linear-gradient(135deg,var(--purple2),var(--pink))}
.pop-btns .rm{margin-right:auto;color:#fda4af}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(20,14,44,.95);border:1px solid var(--purple);padding:9px 18px;border-radius:99px;font-size:13px;z-index:60}
.swap{animation:swap .35s ease}
@keyframes swap{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:900px){
  body{height:auto;overflow:auto;display:block}
  .top{grid-template-columns:1fr;justify-items:center}
  main{grid-template-columns:1fr}
  .tt-scroll{max-height:75vh}
  #todoList{max-height:60vh}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span id="logo"></span><div><b>Dp</b><small>Daily Planner</small></div><em class="beta">β</em></div>
  <div class="datenav">
    <button class="ic" id="prev" title="이전 날 (←)">‹</button>
    <div class="datebox" id="datebox" title="클릭해서 날짜 선택"><div id="dateMain"></div><div id="dateSub"></div><input type="date" id="datePick"></div>
    <button class="ic" id="next" title="다음 날 (→)">›</button>
    <button class="chip" id="today">오늘</button>
  </div>
  <div class="tools"><button class="chip" id="exp" title="데이터를 파일로 저장">백업</button><button class="chip" id="imp" title="백업 파일 불러오기">복원</button><input type="file" id="impFile" accept=".json,application/json" hidden></div>
</header>

<main>
  <section class="panel" id="ttPanel">
    <div class="p-head">
      <h2>타임테이블</h2>
      <div class="legend"><span><i class="lp"></i>예정 · 우클릭 드래그</span><span><i class="lr"></i>기록 · 좌클릭 드래그</span></div>
      <div class="sums"><span class="sum p">예정<b id="sumPlan">0분</b></span><span class="sum r">기록<b id="sumRec">0분</b></span></div>
    </div>
    <div class="mins"><span>:00</span><span>:10</span><span>:20</span><span>:30</span><span>:40</span><span>:50</span></div>
    <div class="tt-scroll" id="ttScroll"><div class="tt-body"><div class="hours" id="hours"></div><div class="grid" id="grid"></div></div></div>
  </section>

  <section class="panel" id="todoPanel">
    <div class="p-head"><h2>To Do List</h2><span class="muted" id="todoCount"></span></div>
    <form id="addForm" autocomplete="off"><input id="addIn" placeholder="할 일을 입력하고 Enter" maxlength="80"><button type="submit">추가</button></form>
    <div class="hint">항목 클릭 → 숫자 입력 → <kbd>Enter</kbd> = 우선순위 · 더블클릭 = 수정</div>
    <ul id="todoList"></ul>
  </section>
</main>

<footer>
  <div class="gauge" id="gauge">
    <div class="g-top"><span class="g-title" id="gTitle">오늘의 달성률</span><span class="g-msg" id="gMsg"></span><span class="g-count" id="gCount"></span></div>
    <div class="g-row">
      <div class="g-pct"><span id="gNum">0</span><small>%</small></div>
      <div class="g-track"><div class="g-fill" id="gFill"><span class="g-shine"></span></div><div class="g-ticks"></div></div>
    </div>
    <div class="g-burst" id="gBurst"></div>
  </div>
</footer>

<div id="pop" class="hidden">
  <div id="popTitle"></div>
  <input id="popIn" maxlength="60" placeholder="무엇을 할까요?" autocomplete="off">
  <div class="pop-btns"><button class="rm" id="popRm">삭제</button><button id="popNo">취소</button><button class="ok" id="popOk">저장</button></div>
</div>
<div id="toast"></div>

<script>
(()=>{
'use strict';
const STORE='dp.v1';
const $=(s,el=document)=>el.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const DOW=['일','월','화','수','목','금','토'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmtT=i=>`${pad(Math.floor(i/6))}:${pad((i%6)*10)}`;
const fmtDur=c=>{const m=c*10,h=Math.floor(m/60),r=m%60;return h?(r?`${h}시간 ${r}분`:`${h}시간`):`${r}분`};

/* icon */
const ICON=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="dpg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#ec4899"/></linearGradient></defs><rect width="100" height="100" rx="24" fill="url(#dpg)"/><path d="M30 25V75H47C65 75 76 64 76 50C76 36 65 25 47 25Z" fill="none" stroke="#fff" stroke-width="9" stroke-linejoin="round"/><path d="M50 50V37M50 50L59 56" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/><circle cx="50" cy="50" r="4.5" fill="#fff"/></svg>`;
$('#logo').innerHTML=ICON;
$('#fav').href='data:image/svg+xml,'+encodeURIComponent(ICON);

/* data */
let db={days:{}};
try{const r=JSON.parse(localStorage.getItem(STORE));if(r&&r.days)db=r}catch(e){}
const EMPTY={plans:[],recs:[],todos:[]};
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify(db))}catch(e){toast('저장에 실패했어요')}};
const getDay=(create)=>{
  if(db.days[curKey])return db.days[curKey];
  if(!create)return EMPTY;
  return db.days[curKey]={plans:[],recs:[],todos:[]};
};

let today=keyOf(new Date());
let curKey=today;
let sel=null, buf='', preview=null, popCtx=null, lastAdded=null, lastTog=null, newTodo=null;

/* toast */
let tt;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200)}

/* timetable skeleton */
const hoursEl=$('#hours'),grid=$('#grid'),ttScroll=$('#ttScroll');
for(let h=0;h<24;h++){
  const d=document.createElement('div');d.textContent=pad(h);hoursEl.appendChild(d);
  const r=document.createElement('div');r.className='hrow'+(h<6||h>=22?' night':'');
  r.innerHTML='<i></i><i></i><i></i><i></i><i></i><i></i>';grid.appendChild(r);
}
const layer=document.createElement('div');layer.className='layer';grid.appendChild(layer);
const nowEl=document.createElement('div');nowEl.className='now';nowEl.style.display='none';layer.appendChild(nowEl);

function addSegs(b,layerName,extra){
  const rowH=100/24, laneH=rowH/2;
  const first=Math.floor(b.s/6), last=Math.floor((b.e-1)/6);
  const out=[];let best=null,bestW=-1;
  for(let r=first;r<=last;r++){
    const cs=Math.max(b.s,r*6)-r*6, ce=Math.min(b.e,(r+1)*6)-r*6;
    const el=document.createElement('div');
    el.className='seg '+layerName+(extra?' '+extra:'');
    el.style.left=`calc(${cs/6*100}% + 1.5px)`;
    el.style.width=`calc(${(ce-cs)/6*100}% - 3px)`;
    el.style.top=`calc(${r*rowH+(layerName==='plan'?0:laneH)}% + 1.5px)`;
    el.style.height=`calc(${laneH}% - 3px)`;
    layer.appendChild(el);out.push(el);
    if(ce-cs>bestW){bestW=ce-cs;best=el}
  }
  if(b.t&&best){const s=document.createElement('span');s.textContent=b.t;best.appendChild(s)}
  return out;
}
function renderBlocks(){
  layer.querySelectorAll('.seg').forEach(e=>e.remove());
  const d=getDay(false);
  d.plans.forEach(b=>addSegs(b,'plan',b.id===lastAdded?'pop':''));
  d.recs.forEach(b=>addSegs(b,'rec',b.id===lastAdded?'pop':''));
  lastAdded=null;
  if(preview)addSegs({s:preview.a,e:preview.b,t:''},preview.layer,'preview');
  $('#sumPlan').textContent=fmtDur(d.plans.reduce((a,b)=>a+b.e-b.s,0));
  $('#sumRec').textContent=fmtDur(d.recs.reduce((a,b)=>a+b.e-b.s,0));
}
function updateNow(){
  const rows=[...hoursEl.children];
  rows.forEach(r=>r.classList.remove('cur'));
  today=keyOf(new Date());
  if(curKey!==today){nowEl.style.display='none';return}
  const n=new Date(),h=n.getHours(),m=n.getMinutes();
  rows[h].classList.add('cur');
  nowEl.style.display='block';
  nowEl.style.left=(m/60*100)+'%';
  nowEl.style.top=(h/24*100)+'%';
  nowEl.style.height=(100/24)+'%';
}

/* drag */
let drag=null;
const idxAt=e=>{
  const r=grid.getBoundingClientRect();
  const x=clamp((e.clientX-r.left)/r.width,0,.9999), y=clamp((e.clientY-r.top)/r.height,0,.9999);
  return Math.floor(y*24)*6+Math.floor(x*6);
};
grid.addEventListener('contextmenu',e=>e.preventDefault());
grid.addEventListener('mousedown',e=>{
  if(e.button!==0&&e.button!==2)return;
  e.preventDefault();
  closePop();
  const i=idxAt(e);
  drag={layer:e.button===2?'plan':'rec',btn:e.button,a:i,b:i,moved:false};
  preview={layer:drag.layer,a:i,b:i+1};renderBlocks();
});
window.addEventListener('mousemove',e=>{
  if(!drag)return;
  const r=ttScroll.getBoundingClientRect();
  if(e.clientY<r.top+30)ttScroll.scrollTop-=14;else if(e.clientY>r.bottom-30)ttScroll.scrollTop+=14;
  const i=idxAt(e);
  if(i!==drag.b){drag.b=i;drag.moved=true;
    preview={layer:drag.layer,a:Math.min(drag.a,i),b:Math.max(drag.a,i)+1};renderBlocks()}
});
window.addEventListener('mouseup',e=>{
  if(!drag||e.button!==drag.btn)return;
  const d=drag;drag=null;
  const a=Math.min(d.a,d.b),b=Math.max(d.a,d.b)+1;
  const arr=d.layer==='plan'?getDay(false).plans:getDay(false).recs;
  const hit=!d.moved&&arr.find(x=>a>=x.s&&a<x.e);
  if(hit){preview=null;renderBlocks();openPop(e,{layer:d.layer,edit:hit})}
  else{preview={layer:d.layer,a,b};renderBlocks();openPop(e,{layer:d.layer,a,b})}
});

/* popup */
const pop=$('#pop'),popIn=$('#popIn');
function openPop(e,ctx){
  popCtx=ctx;
  const a=ctx.edit?ctx.edit.s:ctx.a,b=ctx.edit?ctx.edit.e:ctx.b;
  const t=$('#popTitle');
  t.className=ctx.layer;
  t.textContent=`${ctx.layer==='plan'?'예정':'기록'} · ${fmtT(a)} – ${fmtT(b)}  (${fmtDur(b-a)})`;
  popIn.value=ctx.edit?ctx.edit.t:'';
  $('#popRm').style.display=ctx.edit?'':'none';
  pop.classList.remove('hidden');
  pop.style.left=clamp(e.clientX+14,8,innerWidth-304)+'px';
  pop.style.top=clamp(e.clientY+14,8,innerHeight-160)+'px';
  popIn.focus();popIn.select();
}
function closePop(){
  if(pop.classList.contains('hidden'))return;
  pop.classList.add('hidden');popCtx=null;
  if(preview){preview=null;renderBlocks()}
}
function commitPop(){
  if(!popCtx)return;
  const t=popIn.value.trim();
  const d=getDay(true);
  const key=popCtx.layer==='plan'?'plans':'recs';
  if(popCtx.edit){popCtx.edit.t=t;lastAdded=popCtx.edit.id}
  else{
    const {a,b}=popCtx,out=[];
    for(const x of d[key]){
      if(x.e<=a||x.s>=b){out.push(x);continue}
      if(x.s<a)out.push({...x,e:a});
      if(x.e>b)out.push({...x,id:uid(),s:b});
    }
    const nb={id:uid(),s:a,e:b,t};out.push(nb);d[key]=out;lastAdded=nb.id;
  }
  save();preview=null;popCtx=null;pop.classList.add('hidden');renderBlocks();
}
$('#popOk').onclick=commitPop;
$('#popNo').onclick=closePop;
$('#popRm').onclick=()=>{
  if(popCtx&&popCtx.edit){
    const d=getDay(true),k=popCtx.layer==='plan'?'plans':'recs';
    d[k]=d[k].filter(x=>x!==popCtx.edit);save();
  }
  popCtx=null;pop.classList.add('hidden');renderBlocks();
};
popIn.addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();commitPop()}
  else if(e.key==='Escape'){e.preventDefault();closePop()}
});
document.addEventListener('mousedown',e=>{if(!pop.classList.contains('hidden')&&!pop.contains(e.target)&&!grid.contains(e.target))closePop()});

/* todos */
const list=$('#todoList');
const CHECK='<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
function sortedTodos(){
  return getDay(false).todos.map((t,i)=>({t,i}))
    .sort((a,b)=>(+!!a.t.d-+!!b.t.d)||((a.t.p||1e9)-(b.t.p||1e9))||a.i-b.i).map(x=>x.t);
}
function renderTodos(){
  const before=new Map();
  list.querySelectorAll('.todo').forEach(li=>before.set(li.dataset.id,li.getBoundingClientRect().top));
  const todos=sortedTodos();
  list.innerHTML='';
  if(!todos.length){
    list.innerHTML='<div class="empty">아직 할 일이 없어요<br>위에 입력하고 Enter를 눌러 추가해보세요</div>';
  }
  for(const t of todos){
    const li=document.createElement('li');
    li.className='todo'+(t.c?' c-'+t.c:'')+(t.d?' done':'')+(sel===t.id?' sel':'')+(newTodo===t.id?' enter':'')+(lastTog===t.id?' tog':'');
    li.dataset.id=t.id;
    li.innerHTML=`<button class="chk" data-a="chk" title="완료">${CHECK}</button><div class="txt"></div><span class="prio${t.p?' has':''}">${t.p||''}</span><div class="tools-r"><button class="dot pink" data-a="col" data-c="pink" title="핑크"></button><button class="dot orange" data-a="col" data-c="orange" title="주황"></button><button class="dot blue" data-a="col" data-c="blue" title="파랑"></button><button class="dot green" data-a="col" data-c="green" title="초록"></button><button class="dot none" data-a="col" data-c="" title="색 없음"></button><button class="del" data-a="del" title="삭제">×</button></div>`;
    $('.txt',li).textContent=t.t;
    list.appendChild(li);
  }
  newTodo=null;lastTog=null;
  list.querySelectorAll('.todo').forEach(li=>{
    const o=before.get(li.dataset.id);
    if(o==null)return;
    const dy=o-li.getBoundingClientRect().top;
    if(Math.abs(dy)>1)li.animate([{transform:`translateY(${dy}px)`},{transform:'none'}],{duration:380,easing:'cubic-bezier(.2,.8,.2,1)'});
  });
  const d=getDay(false).todos;
  $('#todoCount').textContent=d.length?`${d.filter(t=>t.d).length} / ${d.length} 완료`:'';
  renderBuf();
  updateGauge();
}
function renderBuf(){
  const el=list.querySelector('.todo.sel .prio');
  if(!el)return;
  if(buf){el.className='prio typing';el.textContent=buf}
  else{const t=getDay(false).todos.find(x=>x.id===sel);el.className='prio'+(t&&t.p?' has':'');el.textContent=t&&t.p?t.p:''}
}
$('#addForm').addEventListener('submit',e=>{
  e.preventDefault();
  const v=$('#addIn').value.trim();if(!v)return;
  const t={id:uid(),t:v,c:'',p:0,d:false};
  getDay(true).todos.push(t);newTodo=t.id;
  $('#addIn').value='';save();renderTodos();
  list.scrollTop=0;
});
list.addEventListener('click',e=>{
  const li=e.target.closest('.todo');if(!li)return;
  if(e.target.closest('input'))return;
  const id=li.dataset.id,d=getDay(true),t=d.todos.find(x=>x.id===id);if(!t)return;
  const a=e.target.closest('[data-a]');
  if(a){
    const act=a.dataset.a;
    if(act==='chk'){t.d=!t.d;lastTog=id}
    else if(act==='col'){t.c=a.dataset.c}
    else if(act==='del'){d.todos=d.todos.filter(x=>x!==t);if(sel===id){sel=null;buf=''}}
    save();renderTodos();return;
  }
  if(sel===id){sel=null}else sel=id;
  buf='';renderTodos();
});
list.addEventListener('dblclick',e=>{
  const txt=e.target.closest('.txt');if(!txt||txt.querySelector('input'))return;
  const li=txt.closest('.todo'),t=getDay(false).todos.find(x=>x.id===li.dataset.id);if(!t)return;
  const inp=document.createElement('input');inp.value=t.t;inp.maxLength=80;
  txt.textContent='';txt.appendChild(inp);inp.focus();inp.select();
  let done=false;
  const fin=ok=>{if(done)return;done=true;const v=inp.value.trim();if(ok&&v){t.t=v;save()}renderTodos()};
  inp.addEventListener('keydown',ev=>{ev.stopPropagation();if(ev.key==='Enter')fin(true);else if(ev.key==='Escape')fin(false)});
  inp.addEventListener('blur',()=>fin(true));
});

/* keyboard: priority + day nav */
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'');
  if(tag==='INPUT'||tag==='TEXTAREA')return;
  if(sel){
    if(/^\d$/.test(e.key)){e.preventDefault();if(buf.length<2)buf+=e.key;renderBuf();return}
    if(e.key==='Backspace'){e.preventDefault();buf=buf.slice(0,-1);renderBuf();return}
    if(e.key==='Enter'){
      e.preventDefault();
      if(buf!==''){
        const t=getDay(true).todos.find(x=>x.id===sel);
        if(t){t.p=parseInt(buf,10)||0;save()}
        sel=null;buf='';renderTodos();
      }
      return;
    }
    if(e.key==='Escape'){sel=null;buf='';renderTodos();return}
    return;
  }
  if(e.key==='ArrowLeft')shiftDay(-1);
  else if(e.key==='ArrowRight')shiftDay(1);
});

/* gauge */
const gauge=$('#gauge');
let shown=0,prevPct=null,anim=0;
function animateNum(to){
  cancelAnimationFrame(anim);
  const from=shown,t0=performance.now(),dur=1000;
  const step=t=>{
    const k=clamp((t-t0)/dur,0,1),e=1-Math.pow(1-k,4);
    shown=from+(to-from)*e;$('#gNum').textContent=Math.round(shown);
    if(k<1)anim=requestAnimationFrame(step);else shown=to;
  };
  anim=requestAnimationFrame(step);
}
function burst(){
  const box=$('#gBurst');box.innerHTML='';
  const cols=['#a855f7','#ec4899','#d8b4fe','#38bdf8','#fde047','#39ff88'];
  for(let i=0;i<34;i++){
    const p=document.createElement('i'),ang=Math.random()*Math.PI*2,dist=50+Math.random()*130;
    p.style.background=cols[i%cols.length];
    p.style.setProperty('--dx',Math.cos(ang)*dist+'px');p.style.setProperty('--dy',Math.sin(ang)*dist-30+'px');
    box.appendChild(p);
  }
  setTimeout(()=>box.innerHTML='',1300);
}
function updateGauge(){
  const todos=getDay(false).todos,total=todos.length,done=todos.filter(t=>t.d).length;
  const pct=total?Math.round(done/total*100):0;
  $('#gFill').style.width=pct+'%';
  animateNum(pct);
  $('#gCount').textContent=total?`완료 ${done} / 전체 ${total}`:'';
  $('#gTitle').textContent=curKey===today?'오늘의 달성률':'이 날의 달성률';
  $('#gMsg').textContent=!total?'할 일을 추가해보세요':pct===0?'시작이 반이에요':pct<50?'좋은 시작이에요':pct<100?'거의 다 왔어요!':'모두 완료! 🎉';
  gauge.classList.toggle('full',total>0&&pct===100);
  if(prevPct!==null&&pct!==prevPct){gauge.classList.remove('bump');void gauge.offsetWidth;gauge.classList.add('bump')}
  if(prevPct!==null&&prevPct<100&&pct===100&&total>0)burst();
  prevPct=pct;
}

/* date nav */
function renderDate(){
  const d=parseKey(curKey);
  $('#dateMain').textContent=`${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일`;
  const diff=Math.round((d-parseKey(today))/864e5);
  const tag=diff===0?'오늘':diff===1?'내일':diff===-1?'어제':'';
  $('#dateSub').innerHTML=`${DOW[d.getDay()]}요일`+(tag?`<span class="tag">${tag}</span>`:'');
  $('#datePick').value=curKey;
}
function setDay(k,dir){
  curKey=k;sel=null;buf='';closePop();
  renderDate();renderBlocks();renderTodos();updateNow();
  for(const el of [$('#hours').parentElement,list]){el.classList.remove('swap');void el.offsetWidth;el.classList.add('swap')}
  if(k===today)scrollToNow();
}
function shiftDay(n){const d=parseKey(curKey);d.setDate(d.getDate()+n);setDay(keyOf(d),n)}
function scrollToNow(){
  const body=ttScroll.firstElementChild,h=new Date().getHours();
  ttScroll.scrollTop=Math.max(0,body.offsetHeight*(h/24)-ttScroll.clientHeight/3);
}
$('#prev').onclick=()=>shiftDay(-1);
$('#next').onclick=()=>shiftDay(1);
$('#today').onclick=()=>{today=keyOf(new Date());setDay(today,0)};
$('#datebox').onclick=()=>{const p=$('#datePick');try{p.showPicker()}catch(e){p.focus()}};
$('#datePick').onchange=e=>{if(e.target.value)setDay(e.target.value,0)};

/* backup */
$('#exp').onclick=()=>{
  const blob=new Blob([JSON.stringify(db,null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`Dp-backup-${keyOf(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);
  toast('백업 파일을 저장했어요');
};
$('#imp').onclick=()=>$('#impFile').click();
$('#impFile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result);if(!j||!j.days)throw 0;
      if(!confirm('현재 데이터를 백업 파일로 덮어쓸까요?'))return;
      db=j;save();setDay(curKey,0);toast('복원했어요');
    }catch(err){toast('올바른 백업 파일이 아니에요')}
  };
  r.readAsText(f);e.target.value='';
};

/* init */
renderDate();renderBlocks();renderTodos();updateNow();
requestAnimationFrame(scrollToNow);
setInterval(()=>{
  const t=keyOf(new Date());
  if(t!==today){const wasToday=curKey===today;today=t;if(wasToday)setDay(t,0);else{renderDate();updateGauge()}}
  updateNow();
},20000);
})();
</script>
</body>
</html>
